[build]
  command = "npm install --include=optional sharp && npm run build"
  publish = "dist"

# Edge Functions configuration
[functions]
  external_node_modules = ["sharp"]

# Environment variables for build process
[build.environment]
  NODE_VERSION = "20"
  SHARP_IGNORE_GLOBAL_LIBVIPS = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-src 'self' https://www.google.com https://recaptcha.google.com; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com; connect-src 'self' https://www.google.com https://ec2-44-233-162-24.us-west-2.compute.amazonaws.com:8889; object-src 'none'; upgrade-insecure-requests; block-all-mixed-content"
    Permissions-Policy = "interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
